<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e9e9e7" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Notion Warm Paper Background -->
  <rect width="1200" height="630" fill="#f7f6f3"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.65"/>

  <!-- Main Notion White Card -->
  <rect x="44" y="40" width="1112" height="550" rx="16" fill="#ffffff" stroke="#d9d9d5" stroke-width="2"/>
  <rect x="44" y="40" width="8" height="550" rx="4" fill="#2383e2"/>

  <!-- Left Content Area -->
  <g transform="translate(96, 88)">
    <!-- Brand Badge + Eyebrow -->
    <rect x="0" y="0" width="56" height="56" rx="10" fill="#2383e2"/>
    <text x="28" y="21" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="800" fill="#dbeafe">118</text>
    <text x="28" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff">Pt</text>

    <rect x="72" y="6" width="236" height="28" rx="6" fill="#e7f3f8" stroke="#9cc7e8" stroke-width="1.2"/>
    <text x="86" y="25" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#185a9d">ChemLab v2.4.0 · 118 prvkov</text>

    <text x="72" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#787774">denisvarga.eu/chemlab · Made by Denis Varga</text>

    <!-- Main Title (Wikipedia Serif + Notion Ink) -->
    <text x="0" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#37352f">ChemLab · Periodická</text>
    <text x="0" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#37352f">sústava a molekuly</text>

    <!-- Subtitle -->
    <text x="0" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#5a5853">
      118 prvkov IUPAC (SK/LAT) · 2D Bohrov model atómu ·
    </text>
    <text x="0" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#5a5853">
      Interaktívny editor vrstiev K–Q · Vizualizér 54+ zlúčenín
    </text>

    <!-- Sample Periodic Table Tiles (Notion Pastel Tags) -->
    <g transform="translate(0, 282)">
      <!-- H -->
      <rect x="0" y="0" width="96" height="104" rx="8" fill="#e7f3f8" stroke="#5b9bd5" stroke-width="2"/>
      <text x="12" y="22" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#185a9d">1</text>
      <text x="48" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#185a9d">H</text>
      <text x="48" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#185a9d">Vodík</text>
      <text x="48" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#185a9d">1,008</text>

      <!-- C -->
      <rect x="112" y="0" width="96" height="104" rx="8" fill="#e7f3f8" stroke="#5b9bd5" stroke-width="2"/>
      <text x="124" y="22" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#185a9d">6</text>
      <text x="160" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#185a9d">C</text>
      <text x="160" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#185a9d">Uhlík</text>
      <text x="160" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#185a9d">12,011</text>

      <!-- O -->
      <rect x="224" y="0" width="96" height="104" rx="8" fill="#fdebec" stroke="#e07c7c" stroke-width="2"/>
      <text x="236" y="22" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#93292c">8</text>
      <text x="272" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#93292c">O</text>
      <text x="272" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#93292c">Kyslík</text>
      <text x="272" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#93292c">15,999</text>

      <!-- Au -->
      <rect x="336" y="0" width="96" height="104" rx="8" fill="#fbf3db" stroke="#d9b44a" stroke-width="2"/>
      <text x="348" y="22" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#7c5a10">79</text>
      <text x="384" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#7c5a10">Au</text>
      <text x="384" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7c5a10">Zlato</text>
      <text x="384" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#7c5a10">196,97</text>

      <!-- Formula Badge: 4CO2 -->
      <rect x="448" y="0" width="168" height="104" rx="8" fill="#f7f6f3" stroke="#2383e2" stroke-width="2"/>
      <text x="532" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#787774">VZOREC MOLEKULY</text>
      <text x="532" y="64" text-anchor="middle" font-family="ui-monospace, monospace" font-size="32" font-weight="900" fill="#2383e2">4CO₂</text>
      <text x="532" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#37352f">Oxid uhličitý (12 at.)</text>
    </g>

    <!-- Bottom Author Pill -->
    <g transform="translate(0, 416)">
      <rect x="0" y="0" width="440" height="38" rx="8" fill="#f7f6f3" stroke="#e9e9e7" stroke-width="1.5"/>
      <circle cx="22" cy="19" r="5" fill="#16a34a"/>
      <text x="38" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#37352f">
        Made by Denis Varga · https://denisvarga.eu/chemlab
      </text>
    </g>
  </g>

  <!-- Right Graphic: 2D Bohr Atom Model + CO2 Molecule Illustration -->
  <g transform="translate(935, 275)">
    <!-- Outer Card Circle -->
    <circle cx="0" cy="0" r="185" fill="#f7f6f3" stroke="#e9e9e7" stroke-width="2"/>
    <!-- Bohr Electron Shells -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#9cc7e8" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="#5b9bd5" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#2383e2" stroke-width="2.5"/>

    <!-- Nucleus -->
    <circle cx="0" cy="0" r="24" fill="#2383e2"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">6C</text>

    <!-- Electrons on K shell (2) -->
    <circle cx="0" cy="-52" r="7" fill="#2383e2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="52" r="7" fill="#2383e2" stroke="#ffffff" stroke-width="2"/>

    <!-- Electrons on L shell (4) -->
    <circle cx="-98" cy="0" r="7.5" fill="#2383e2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="98" cy="0" r="7.5" fill="#2383e2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-69" cy="-69" r="7.5" fill="#2383e2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="69" cy="69" r="7.5" fill="#2383e2" stroke="#ffffff" stroke-width="2"/>

    <!-- Outer Decorative Atoms (O=C=O mini badge below) -->
    <g transform="translate(0, 198)">
      <rect x="-125" y="-22" width="250" height="44" rx="22" fill="#ffffff" stroke="#d9d9d5" stroke-width="1.5"/>
      <line x1="-58" y1="-3" x2="58" y2="-3" stroke="#64748b" stroke-width="3"/>
      <line x1="-58" y1="3" x2="58" y2="3" stroke="#64748b" stroke-width="3"/>
      <circle cx="-62" cy="0" r="14" fill="#ef4444"/>
      <text x="-62" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">O</text>
      <circle cx="0" cy="0" r="14" fill="#334155"/>
      <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">C</text>
      <circle cx="62" cy="0" r="14" fill="#ef4444"/>
      <text x="62" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">O</text>
    </g>
  </g>
</svg>
